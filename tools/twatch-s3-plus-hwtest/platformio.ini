; Standalone hardware bring-up test for the LilyGo T-Watch S3 Plus.
; Powers the AXP2101 rails, scans both I2C buses, cycles display colours,
; reports touch points and checks the SX1262 answers.
[env:hwtest]
platform = platformio/espressif32@6.11.0
framework = arduino
board = lilygo_twatch_s3_plus
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM=1
  -D CORE_DEBUG_LEVEL=3
lib_deps =
  lewisxhe/XPowersLib @ ^0.2.7
  lovyan03/LovyanGFX @ ^1.2.0
  jgromes/RadioLib @ ^7.1.2
